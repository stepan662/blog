baseURL = 'https://granat.blog/'
title = "Štěpán's web and blog"

# Root-absolute links (/style.css, /posts). Requires the site to be served at
# the domain root and built with this baseURL — which the GH Actions workflow
# now does (it builds from hugo.toml, not the github.io/<repo> subpath).

[languages.en]
  locale = 'en-us'
  weight = 1

# Pretty, predictable output
enableRobotsTXT = true
disablePathToLower = false

[params]
  # Shown in the header frame and footer
  author = 'Štěpán Granát'
  description = 'Personal site and blog of Štěpán Granát — a frontend developer writing about React, web performance, and the stubborn problems underneath both.'
  # Short suffix for <title> on list pages. Posts drop it entirely: Google cuts
  # titles around 60 characters, and an article headline needs every one of them.
  brand = 'granat.blog'
  # X/Twitter handle, with or without the @. Drives twitter:site and
  # twitter:creator on the card — without it X attributes the unfurl to nobody.
  twitter = '@stepan_granat'
  # GoatCounter site code — the subdomain you pick at signup, so if your
  # dashboard is stepan.goatcounter.com this is 'stepan'. Empty or missing
  # disables analytics entirely; it only ever loads in production builds.
  goatcounter = 'stepan-granat'
  # Social links: key = label shown in the footer, value = full URL.
  # Add any platform by adding a line — the template renders them all.
  # (For email, use a mailto: URL or just the address.)
  [params.social]
    # Quoted: an unquoted dot would make TOML read this as a [dev] table.
    'dev.to' = 'https://dev.to/stepan662'
    github = 'https://github.com/stepan662'
    linkedin = 'https://www.linkedin.com/in/stepan-granat/'
    x = 'https://x.com/stepan_granat'

# Projects listed on the home page, in the order written here — unlike
# [params.social], which the template sorts alphabetically. 'blurb' is
# optional; omit it and only the name renders.
[[params.projects]]
  name = 'genroc'
  url = 'https://genroc.org'
  blurb = 'A strongly typed durable process orchestrator'
[[params.projects]]
  name = 'react-arven'
  url = 'https://github.com/stepan662/react-arven'
  blurb = 'React state management helper'

[menus]
  [[menus.main]]
    name = 'home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'blog'
    pageRef = '/posts'
    weight = 20

[markup]
  [markup.highlight]
    noClasses = false   # emit CSS classes so our stylesheet controls colors
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true       # allow raw HTML in markdown when needed

[taxonomies]
  tag = 'tags'

[pagination]
  pagerSize = 10
